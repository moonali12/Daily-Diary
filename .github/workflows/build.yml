```yaml
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android SDK and AIDL
        run: |
          SDK="/root/.buildozer/android/platform/android-sdk"

          echo "Searching for sdkmanager..."

          SDKMANAGER=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$SDK" -maxdepth 5 -type f 2>/dev/null | head -n 50
            exit 1
          fi

          chmod +x "$SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK" "build-tools;33.0.2"

          echo "Checking AIDL..."

          find "$SDK/build-tools" -name aidl -type f

      - name: Build APK with Buildozer
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          buildozer --v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
```
