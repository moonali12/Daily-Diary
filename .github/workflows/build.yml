name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Python 3.11 Environment Setup
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 2. Java (JDK 17) Setup (Android Build ke liye lazmi hai)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. System Dependencies & BuildTools Install
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache git libffi-dev libssl-dev python3-pip zip unzip openjdk-17-jdk
          python -m pip install --upgrade pip
          pip install "cython<3.0.0" buildozer kivy

      # 4. Buildozer Android Debug Run
      - name: Build APK with Buildozer
        run: |
          # SDK licenses auto accept aur AIDL setup Buildozer khud handle karega
          yes | buildozer android debug

      # 5. Upload APK Artifact (v4)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
