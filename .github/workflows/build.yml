name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Python 3.11 Setup
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 2. Java JDK 17 Setup
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. System Dependencies (Force Non-Interactive Mode)
      - name: Install System Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Etc/UTC
        run: |
          sudo -E apt-get update
          sudo -E apt-get install -y --no-install-recommends \
            ccache git libffi-dev libssl-dev python3-pip zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake
          python -m pip install --upgrade pip setuptools
          pip install "cython<3.0.0" buildozer kivy

      # 4. Accept Android SDK Licenses
      - name: Accept Android SDK Licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 5. Build APK with Buildozer
      - name: Build APK with Buildozer
        run: |
          buildozer --v android debug

      # 6. Upload APK Artifact (v4)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
