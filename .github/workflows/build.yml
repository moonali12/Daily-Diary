```yaml
name: Build Android APK

'on':
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android SDK
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK/cmdline-tools"

          cd /tmp

          python3 -c "import urllib.request; urllib.request.urlretrieve('https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip', 'cmdline-tools.zip')"

          mkdir -p /tmp/android-tools
          unzip -q cmdline-tools.zip -d /tmp/android-tools

          mkdir -p "$SDK/cmdline-tools/latest"
          cp -r /tmp/android-tools/cmdline-tools/. "$SDK/cmdline-tools/latest/"

          mkdir -p "$SDK/tools/bin"

          ln -sfn "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROIDSDK="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --sdk_root="$SDK" --licenses || true

          sdkmanager --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: bin/*.apk
          if-no-files-found: error
```
