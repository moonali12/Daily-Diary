name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install AIDL
        run: |
          SDK="/root/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK"

          apt-get update
          apt-get install -y unzip wget

          mkdir -p "$SDK/build-tools/33.0.2"
          cd /tmp

          wget -q https://dl.google.com/android/repository/build-tools_r33.0.2-linux.zip -O bt.zip
          unzip -oq bt.zip -d /tmp/bt

          cp -r /tmp/bt/android-13/. "$SDK/build-tools/33.0.2/"

          chmod +x "$SDK/build-tools/33.0.2/aidl"

          echo "$SDK/build-tools/33.0.2" >> "$GITHUB_PATH"

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          buildozer --v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
